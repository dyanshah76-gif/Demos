<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mes apps">
<meta name="theme-color" content="#06050c">
<link rel="apple-touch-icon" href="icons/icon-180.png?v=2">
<link rel="icon" type="image/png" href="icons/icon-192.png?v=2">
<link rel="manifest" href="manifest.webmanifest">
<title>Mes apps</title>
<script>
  // Thème : choix enregistré, sinon réglage du téléphone
  (function(){ var t=null; try{t=localStorage.getItem('apps-theme')}catch(e){}
    if(!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t; })();
</script>
<style>
  :root{--bg:#fffaf3;--ink:#1d1b2f;--muted:#6b6880;--card:#fff;--sub:#4a475c;--track:#f1e9df;--shadow:0 6px 20px rgba(60,30,0,.08);
        --c1:#e8f8ef;--c2:#e0f2ff;--c3:#fff1d6;--c4:#f0e8ff;--c5:#ffe3ec;--accent:#7c3aed;
        --head:linear-gradient(135deg,#ff7a00,#ff3d77 50%,#7c3aed)}
  [data-theme=dark]{--bg:#0b0a1f;--ink:#f3f1ff;--muted:#9a96b8;--card:#17153a;--sub:#c3bfe0;--track:#2a2752;--shadow:0 6px 24px rgba(0,0,0,.45);
        --c1:#0f2e25;--c2:#0f2440;--c3:#33240e;--c4:#261a4d;--c5:#3a1428;--accent:#b79bff;
        --head:linear-gradient(135deg,#1a1050,#3b1670 55%,#6a1b5e)}
  *{box-sizing:border-box}
  html,body{transition:background .3s,color .3s}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
  header{background:var(--head);color:#fff;padding:26px 18px 74px;position:relative;overflow:hidden}
  [data-theme=dark] header::before{content:"";position:absolute;inset:0;background-image:radial-gradient(1.5px 1.5px at 20% 30%,#fff,transparent),radial-gradient(1px 1px at 70% 20%,#fff,transparent),radial-gradient(1.5px 1.5px at 85% 60%,#fff,transparent),radial-gradient(1px 1px at 40% 70%,#fff,transparent),radial-gradient(1px 1px at 10% 80%,#fff,transparent),radial-gradient(1.5px 1.5px at 55% 45%,#fff,transparent);opacity:.8}
  header h1{margin:0;font-size:24px;position:relative}
  header p{margin:4px 0 0;opacity:.9;font-size:14px;position:relative}
  #theme{position:absolute;top:20px;right:16px;border:0;width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.18);font-size:22px;cursor:pointer;backdrop-filter:blur(6px)}
  main{max-width:640px;margin:-54px auto 40px;padding:0 14px;position:relative}
  .goal{background:var(--card);border-radius:20px;padding:16px;box-shadow:var(--shadow);margin-bottom:16px;display:block;text-decoration:none;color:inherit}
  .goal .row{display:flex;justify-content:space-between;align-items:baseline}
  .goal b{font-size:26px;color:var(--accent)}
  .goal small{color:var(--muted);font-size:13px}
  .bar{height:14px;background:var(--track);border-radius:99px;overflow:hidden;margin-top:10px}
  .bar div{height:100%;width:0;background:linear-gradient(90deg,#ff7a00,#ff3d77,#7c3aed);border-radius:99px;transition:width .6s}
  [data-theme=dark] .bar div{box-shadow:0 0 12px rgba(255,61,119,.7)}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:22px 4px 10px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  a.app{display:flex;flex-direction:column;gap:6px;padding:16px;border-radius:20px;text-decoration:none;color:var(--ink);min-height:120px;box-shadow:var(--shadow);transition:transform .15s}
  [data-theme=dark] a.app{border:1px solid rgba(255,255,255,.06)}
  a.app:active{transform:scale(.97)}
  .app .ic{font-size:30px}
  .app b{font-size:16px}
  .app span{font-size:13px;color:var(--sub);line-height:1.35}
  .c1{background:var(--c1)}.c2{background:var(--c2)}.c3{background:var(--c3)}.c4{background:var(--c4)}.c5{background:var(--c5)}
</style>
</head>
<body>
<header>
  <button id="theme" aria-label="Mode nuit / jour"></button>
  <h1>🚀 Mes apps</h1>
  <p id="hello">Une seule mission : 1 000 € de bénéfice.</p>
</header>
<main>
  <a class="goal" href="../perso-compta-d7k2/">
    <div class="row"><small id="gMonth">Bénéfice du mois</small><small id="gLeft"></small></div>
    <b id="gProfit">—</b>
    <div class="bar"><div id="gBar"></div></div>
  </a>

  <h2>Business</h2>
  <div class="grid">
    <a class="app c1" href="../perso-compta-d7k2/"><span class="ic">💸</span><b>Entrées & Sorties</b><span>Chaque euro, le jour même</span></a>
    <a class="app c2" href="../perso-idees-d7k2/"><span class="ic">🧊</span><b>Idées plus tard</b><span id="ideasTxt">Gelées jusqu'à 1 000 €</span></a>
    <a class="app c3" href="https://renovphare.fr" target="_blank" rel="noopener"><span class="ic">🔦</span><b>Renovphare</b><span>Mon site — renovphare.fr</span></a>
  </div>

  <h2>Deen</h2>
  <div class="grid">
    <a class="app c4" href="https://dyanshah76-gif.github.io/Quran/"><span class="ic">📖</span><b>Coran</b><span>Lecture du Coran</span></a>
    <a class="app c5" href="https://dyanshah76-gif.github.io/Quran/adhkar.html"><span class="ic">📿</span><b>Adhkar</b><span>Matin, soir & après la prière</span></a>
  </div>
</main>
<script>
const themeBtn=document.getElementById('theme');
function setIcon(){ themeBtn.textContent = document.documentElement.dataset.theme==='dark' ? '☀️' : '🌙'; }
setIcon();
themeBtn.onclick=()=>{ const t=document.documentElement.dataset.theme==='dark'?'light':'dark'; document.documentElement.dataset.theme=t; try{localStorage.setItem('apps-theme',t)}catch(e){} setIcon(); };
// Même domaine (dyanshah76-gif.github.io) : on lit les données des autres apps, sur cet appareil.
const eur = n => (Math.round(n*100)/100).toLocaleString('fr-FR',{maximumFractionDigits:2}) + ' €';
try {
  const now = new Date();
  const key = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0');
  document.getElementById('gMonth').textContent = 'Bénéfice · ' + now.toLocaleDateString('fr-FR',{month:'long'});
  const rows = JSON.parse(localStorage.getItem('compta-business-v1') || 'null');
  if (Array.isArray(rows)) {
    const p = rows.filter(r => r.date.slice(0,7) === key).reduce((s,r) => s + (r.type === 'in' ? r.amount : -r.amount), 0);
    gProfit.textContent = eur(p);
    gLeft.textContent = p >= 1000 ? '🎉 Objectif atteint' : 'reste ' + eur(1000 - p);
    setTimeout(() => gBar.style.width = Math.max(0, Math.min(100, p/10)) + '%', 100);
  } else {
    gProfit.textContent = 'Ouvre la compta une fois';
  }
  const ideas = JSON.parse(localStorage.getItem('idees-plus-tard-v1') || 'null');
  if (Array.isArray(ideas)) ideasTxt.textContent = ideas.length + ' idées gelées jusqu\'à 1 000 €';
} catch(e) {}
</script>
</body>
</html>
